name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: lotus
          POSTGRES_PASSWORD: lotus_test_password
          POSTGRES_DB: lotusyoga_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lotus -d lotusyoga_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install
        run: |
          npm ci --silent --prefix backend
          npm ci --silent --prefix frontend
      - name: Lint
        run: |
          npm run lint --prefix backend
          npm run lint --prefix frontend
      - name: Backend tests (committed .env.test)
        run: npm test --prefix backend -- --coverage --reporter=dot
      - name: Frontend tests
        run: npm test --prefix frontend -- --coverage --reporter=dot
      - name: Generate coverage badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for p in backend frontend; do
            bash .github/scripts/make-badges.sh "$p/coverage/coverage-summary.json" "badges-out/coverage/$p"
          done
      - name: Publish badges to orphan branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd badges-out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update coverage badges"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges

  release:
    needs: test
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use 0.0.1 for the first release
        id: first
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            echo "custom_tag=0.0.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          custom_tag: ${{ steps.first.outputs.custom_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Determine image version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.tag_version.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
