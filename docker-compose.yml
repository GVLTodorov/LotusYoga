name: lotusyoga
services:
  app:
    build: .
    image: lotusyoga:dev
    # Secrets are REQUIRED: compose fails if unset. Provide them in a gitignored .env next to
    # this file (JWT_SECRET, ADMIN_PASSWORD, POSTGRES_PASSWORD, ...) or from host/CI secrets.
    # Never commit real values. Local dev: docker compose --env-file .env.compose.dev up
    environment:
      NODE_ENV: production
      PORT: "5080"
      HOST: 0.0.0.0
      STATIC_DIR: /app/public
      APP_URL: ${APP_URL:-http://localhost:5080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lotus}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to docker-compose.yml}@db:5432/${POSTGRES_DB:-lotusyoga}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env next to docker-compose.yml}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-LotusYoga <no-reply@lotusyoga.local>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lotusyoga.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env next to docker-compose.yml}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
    ports: ["5080:5080"]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [lotus]
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lotus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to docker-compose.yml}
      POSTGRES_DB: ${POSTGRES_DB:-lotusyoga}
    ports: ["5432:5432"]
    # init script creates lotusyoga_test for backend tests; it only runs on a fresh volume
    # (existing volume: docker compose down -v, or create the database manually).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./.github/scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotus -d lotusyoga"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lotus]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lotus]
networks:
  lotus: {}
volumes:
  pgdata: {}
