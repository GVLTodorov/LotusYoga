name: lotusyoga
services:
  app:
    build: .
    image: lotusyoga:dev
    env_file: backend/.env.development
    environment:
      NODE_ENV: development
      PORT: "5080"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://lotus:lotus_dev_password@db:5432/lotusyoga?schema=public
    ports: ["5080:5080"]
    depends_on:
      db:
        condition: service_healthy
    networks: [lotus]
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lotus
      POSTGRES_PASSWORD: lotus_dev_password
      POSTGRES_DB: lotusyoga
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotus -d lotusyoga"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lotus]
networks:
  lotus: {}
volumes:
  pgdata: {}
